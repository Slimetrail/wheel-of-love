<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#2a0a3d"><meta name="robots" content="noindex">
<title>Wheel of Love</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/icon-192.png">
<style>#lock{font-family:system-ui,sans-serif;min-height:100vh;margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,#6b1e8f,#2a0a3d 60%,#12021c);padding:20px;box-sizing:border-box;text-align:center;color:#fff}
body{margin:0}#lock img{width:120px;border-radius:26px;box-shadow:0 0 30px #ff69b4}#lock h1{color:#ffd700;font-size:40px;margin:14px 0 4px;text-shadow:0 3px 0 #b8860b}
#lock input{font-size:26px;padding:16px;border-radius:16px;border:4px solid #ffd700;width:100%;max-width:340px;box-sizing:border-box;margin:12px 0;text-align:center}
#lock button{font-size:24px;font-weight:900;border:0;border-radius:18px;padding:18px;width:100%;max-width:340px;margin:8px 0;color:#4a0f6b;background:linear-gradient(#ffe57a,#d4a017);box-shadow:0 5px 0 #8a6408}
#lock #lInstall{background:linear-gradient(#ff8fc8,#e0428f);color:#fff;box-shadow:0 5px 0 #8a1f55}#lErr{color:#ff9db0;font-weight:800;min-height:26px}.hide{display:none!important}</style></head>
<body><div id="lock"><img src="icons/icon-192.png" alt=""><h1>Wheel of Love</h1><p>Enter the password 💖</p>
<input id="pw" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Password"><div id="lErr"></div><button id="lGo">🔓 Unlock</button>
<button id="lInstall">📲 Install app</button><div id="lHelp" class="hide">Tap Chrome's <b>⋮</b> menu → <b>Install app</b> / <b>Add to Home screen</b><br><small>(iPhone: Share ⬆️ → Add to Home Screen)</small></div></div>
<script src="loader.js"></script></body></html>
